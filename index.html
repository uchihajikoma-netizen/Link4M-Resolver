<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Link4M Resolver</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#29365c,transparent 55%),#0b1020;color:#f2f5ff;font:16px system-ui;display:grid;place-items:center;padding:18px}.app{width:min(620px,100%)}header{text-align:center;margin-bottom:25px}.logo{margin:auto auto 12px;width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#8c9bff,#6557d8);font-size:27px}h1{margin:0;font-size:clamp(27px,6vw,40px)}header p{color:#aab8d2;margin:8px 0}.card{background:#141e33;border:1px solid #2b3b5b;border-radius:22px;padding:23px;box-shadow:0 24px 70px #0006}label{display:block;font-weight:700;margin-bottom:9px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #3a4b6d;background:#0a1223;color:white;font-size:15px;outline:none}input:focus{border-color:#8c9bff}button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:12px;background:linear-gradient(135deg,#8294ff,#6859df);color:white;font-size:16px;font-weight:750}button:disabled{opacity:.55}.result{display:none;margin-top:17px;padding:15px;border:1px solid #315b55;background:#0b201f;border-radius:13px;overflow-wrap:anywhere}.result.error{border-color:#794653;background:#24131a}.result a{color:#aebaff;overflow-wrap:anywhere}.actions{display:flex;gap:9px}.actions button{flex:1;background:#263653}.note{color:#94a4c1;font-size:12px;line-height:1.5;margin-top:18px}.history{margin-top:20px}.history h2{font-size:17px}.item{padding:12px;border:1px solid #293a59;border-radius:12px;margin-top:9px;overflow-wrap:anywhere;font-size:13px}.item a{color:#b4c0ff}.empty{color:#8494b1;font-size:13px}
</style></head><body><main class="app"><header><div class="logo">↗</div><h1>Link4M Resolver</h1><p>Tìm địa chỉ đích từ liên kết Link4M</p></header><section class="card"><form id="form"><label for="url">Dán link Link4M</label><input id="url" type="url" placeholder="https://link4m.com/..." required><button id="go">Tìm link cuối cùng</button></form><div id="result" class="result" aria-live="polite"></div><div class="note">Công cụ chỉ kiểm tra chuyển hướng HTTP thông thường. Không bỏ qua quảng cáo, CAPTCHA, đăng nhập hoặc bước xác minh. Một số liên kết có thể không phân giải được.</div></section><section class="history"><h2>🕘 Lịch sử trên thiết bị</h2><div id="history" class="empty">Chưa có kết quả.</div></section></main><script>
const WORKER_URL="PASTE_CLOUDFLARE_WORKER_URL_HERE";const $=s=>document.querySelector(s);let hist=[];try{hist=JSON.parse(localStorage.getItem("l4m-resolver-history")||"[]")}catch{}
function render(){let el=$("#history");el.replaceChildren();if(!hist.length){el.textContent="Chưa có kết quả.";return}hist.slice(0,15).forEach(x=>{let d=document.createElement("div");d.className="item";let a=document.createElement("a");a.href=x.final;a.target="_blank";a.rel="noopener";a.textContent=x.final;let p=document.createElement("div");p.textContent=x.input; p.style.color="#8798b5";p.style.marginBottom="5px";d.append(p,a);el.append(d)})}
$("#form").addEventListener("submit",async e=>{e.preventDefault();let raw=$("#url").value.trim(),u;try{u=new URL(raw);if(!["http:","https:"].includes(u.protocol)||!["link4m.com","www.link4m.com"].includes(u.hostname))throw 0}catch{$("#result").className="result error";$("#result").style.display="block";$("#result").textContent="Vui lòng nhập URL Link4M hợp lệ (link4m.com).";return}
if(WORKER_URL.startsWith("PASTE_")){$("#result").className="result error";$("#result").style.display="block";$("#result").textContent="Cần triển khai Worker theo README rồi dán URL Worker vào WORKER_URL.";return}
let b=$("#go");b.disabled=true;b.textContent="Đang kiểm tra…";try{let r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u.href})});let d=await r.json();if(!r.ok||!d.finalUrl)throw Error(d.message||"Không tìm được chuyển hướng cuối.");let final=new URL(d.finalUrl);$("#result").className="result";$("#result").style.display="block";$("#result").replaceChildren();let title=document.createElement("b");title.textContent="Địa chỉ đích nhận được:";let link=document.createElement("a");link.href=final.href;link.target="_blank";link.rel="noopener";link.textContent=final.href;let actions=document.createElement("div");actions.className="actions";let copy=document.createElement("button");copy.textContent="Sao chép";copy.onclick=async()=>{try{await navigator.clipboard.writeText(final.href);copy.textContent="Đã sao chép ✓"}catch{copy.textContent="Không sao chép được"}};let open=document.createElement("button");open.textContent="Mở link";open.onclick=()=>window.open(final.href,"_blank","noopener");actions.append(copy,open);$("#result").append(title,document.createElement("br"),link,actions);hist.unshift({input:u.href,final:final.href});hist=hist.slice(0,15);localStorage.setItem("l4m-resolver-history",JSON.stringify(hist));render()}catch(err){$("#result").className="result error";$("#result").style.display="block";$("#result").textContent=err.message||"Có lỗi khi kiểm tra link."}finally{b.disabled=false;b.textContent="Tìm link cuối cùng"}});
render();
</script></body></html>
